[[talks]]
name = "AI Frameworks Are Making You Worse"
icon = ["fab", "youtube"]
link = "https://www.youtube.com/watch?v=mkRg7a5ndEQ"
link_text = "/watch?v=mkRg7a5ndEQ"
date = "May 2026"
description = """
In this talk I argue that AI frameworks like LangChain, LlamaIndex, and Haystack \
often do more harm than good: bloat, leaky abstractions, debugging hell. \
I build real features with plain Python and lightweight libraries first, then \
show what frameworks layer on top and when their adoption actually becomes justified.
"""

[[talks]]
name = "Haystack 2.0: The Story of a Rewrite"
icon = ["fab", "youtube"]
link = "https://www.youtube.com/watch?v=0CNSvGlMNSo"
link_text = "/watch?v=0CNSvGlMNSo"
date = "Apr 2024"
description = """
This talk focuses on the story of the Haystack 2.0 rewrite that \
my team and I undertook. I discuss the pros and cons of starting a rewrite \
and outline important tasks to consider before embarking on such a journey. \
In the end, I also present some differences between Haystack 1 and 2 to highlight \
the improvements we achieved through the rewrite.
"""

[[talks]]
name = "Monitoring Open Source Success in Arduino"
icon = ["fab", "youtube"]
link = "https://www.youtube.com/watch?v=C4JxwgNnIWU"
link_text = "/watch?v=C4JxwgNnIWU"
date = "Oct 2021"
description = """
In this talk, I share the story of how my team began using Datadog in \
an unconventional way to monitor the success of one of our most important \
Open Source projects, the Arduino CLI. We gathered download information from \
various sources and monitored build failures. I also explore potential next \
steps for gaining deeper insights into our other projects.
"""
